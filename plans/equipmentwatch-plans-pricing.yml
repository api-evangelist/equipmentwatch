description: >-
  EquipmentWatch publishes NO API pricing. There is no pricing page, no tier table, no
  published rate card and no self-service checkout anywhere on equipmentwatch.com or
  fusable.com. Every API page ends in the same call to action — "Request an API key" —
  which opens a HubSpot lead form. Access is negotiated through sales.

