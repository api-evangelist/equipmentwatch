superseded_content:
  note: >-
    This file previously carried a three-tier Free / Professional / Enterprise plan set with
    specific quotas (1,000 and 100,000 requests/month), rate limits (10 and 100 rpm) and
    element lists. NONE of that was published by EquipmentWatch. It was written by the
    2026-05-04 API Evangelist bulk sweep as a scaffold and its own description said so
    ("scaffold defaults; replace with provider-published values"). It has been removed
    rather than left in place, because a scaffold that survives long enough starts getting
    quoted back as fact — a 2026-09-06 web search for EquipmentWatch API pricing returned
    our own scaffold, published on apis.io, as the answer. plan_count: 0 is the true value.
  removed: '2026-09-06'
  removed_by: enrichment pipeline local-v3

