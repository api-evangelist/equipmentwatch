aid: equipmentwatch
name: Equipmentwatch
description: >-
  EquipmentWatch (a Fusable brand, operated by Randall-Reilly, LLC) provides construction and
  equipment data APIs that deliver rental rates, ownership and operating costs, market values,
  machine specifications, serial-number verification and raw market transaction data for heavy
  equipment. Their data is used by contractors, equipment dealers, rental houses, lenders and
  insurance professionals to make informed decisions about equipment valuation, procurement,
  cost recovery and rental rate setting. The EquipmentWatch API is published as a single
  OpenAPI 3.0.3 contract at docs.equipmentwatchapi.com covering the Taxonomy, Values,
  Specifications, Rental, Verification, Cost and Bulk surfaces, served from
  equipmentwatchapi.com with a documented sandbox host, and authenticated with an x-api-key
  header issued through a request-an-API-key form.
